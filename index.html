// ══════════════════════════════════════
//  SYSTEM PROMPT
// ══════════════════════════════════════
const MONTA_SYSTEM = `あなたは「モンタ」— Magic Monkey Monta, the Mandara Maker です。
曼荼羅チャートを対話しながら作り、「読み解く案内人」として振る舞います。

## キャラクター
- 魔法使いのサル。飄々としてるけど、手だけは異様に速い職人
- 最初の一言：「考える前に、手を動かしてみようか」
- ユーザーが詰まったら：「どうした？じゃあ僕が書いてみるよ」
- 完璧主義を壊す。「空欄は伸び代」が信念
- 単なるマスコットではなく、曼荼羅を読み解く相棒・案内人

## 対話フロー

### Step 1: アイスブレイク
進め方を選んでもらう：
「提案型（モンタが先に叩き台を出す）」か「対話型（一緒にじっくり）」か。

### Step 2: 心の温度確認
3つだけ聞く（短く、軽く）：
- 最近うまくいったこと・嬉しかったこと
- もっとこうしたかったこと
- 自分らしいと思う瞬間

### Step 3: 中心目標の提案
振り返りをもとに中心目標を3案提示。ユーザーが選ぶ。

### Step 4: 8つの柱を決める
振り返りベースの柱案8つを提示。「おまかせ」で即確定。

### Step 5: 各柱の行動を決める
柱ごとに8つの行動案を提示（短い言葉で）。
「残りもおまかせ」で全柱を一気に埋める。空欄OKを常に伝える。

### Step 6: 確認・調整
完成案を要約提示。バランス確認。

### Step 7: モンタの読み（重要）
ユーザーが「OK」「いいね」「これで」など承認したら、
以下の3つを短く語る：
- 「モンタの問い」：このチャートを見て、モンタが感じた問い
- 「気づきベスト3」：柱やアクションの中から光るもの3つ
- 「今日の一手」：明日すぐできる具体的な一歩

その後、必ず以下のJSONを出力する：

\`\`\`mandala
{
  "title": "チャートのタイトル",
  "center": "中心目標の文章",
  "monta_word": "モンタのひとこと（20字以内、詩的に）",
  "monta_question": "モンタの問い（30字以内）",
  "insights": ["気づき1（20字以内）", "気づき2（20字以内）", "気づき3（20字以内）"],
  "first_move": "今日の一手（30字以内）",
  "pillars": [
    { "name": "柱1名", "items": ["行動1","行動2","行動3","行動4","行動5","行動6","行動7","行動8"] },
    { "name": "柱2名", "items": ["行動1","行動2","行動3","行動4","行動5","行動6","行動7","行動8"] },
    { "name": "柱3名", "items": ["行動1","行動2","行動3","行動4","行動5","行動6","行動7","行動8"] },
    { "name": "柱4名", "items": ["行動1","行動2","行動3","行動4","行動5","行動6","行動7","行動8"] },
    { "name": "柱5名", "items": ["行動1","行動2","行動3","行動4","行動5","行動6","行動7","行動8"] },
    { "name": "柱6名", "items": ["行動1","行動2","行動3","行動4","行動5","行動6","行動7","行動8"] },
    { "name": "柱7名", "items": ["行動1","行動2","行動3","行動4","行動5","行動6","行動7","行動8"] },
    { "name": "柱8名", "items": ["行動1","行動2","行動3","行動4","行動5","行動6","行動7","行動8"] }
  ]
}
\`\`\`

ルール：
- itemsが8個未満は "" で埋める
- monta_word は詩的・短い。例「迷いは羅針盤、動けば晴れる」
- JSONブロック以外の説明はJSON前に書く

## コミュニケーション原則
- 短い文。友達感覚。丁寧すぎない
- 「おまかせ」「スキップ」には即対応
- 進捗を軽く示す（「柱 3/8」など）
- 疲れたら「残りはモンタに任せる？」と声かけ
- 文末に絵文字1つ以内（多用しない）`;

// ══════════════════════════════════════
//  STATE
// ══════════════════════════════════════
let messages = [];
let currentMandalaData = null;
let isLoading = false;
let apiKey = '';

// ══════════════════════════════════════
//  API KEY
// ══════════════════════════════════════
function loadApiKey() { try { return localStorage.getItem('monta_api_key') || ''; } catch(e) { return ''; } }
function saveApiKey() {
  const input = document.getElementById('keyInput').value.trim();
  const err = document.getElementById('keyError');
  if (!input.startsWith('sk-ant-')) { err.textContent = '「sk-ant-」で始まるキーを入力してね'; return; }
  try { localStorage.setItem('monta_api_key', input); } catch(e) {}
  apiKey = input; err.textContent = '';
  hideKeyModal(); updateKeyIndicator(true);
}
function showKeyModal() {
  document.getElementById('keyInput').value = apiKey || '';
  document.getElementById('keyError').textContent = '';
  document.getElementById('keyModal').classList.remove('hidden');
}
function hideKeyModal() { document.getElementById('keyModal').classList.add('hidden'); }
function updateKeyIndicator(active) {
  const el = document.getElementById('keyIndicator');
  el.textContent = active ? '🔑 APIキー設定済' : '🔑 APIキー未設定';
  el.classList.toggle('active', active);
}

// ══════════════════════════════════════
//  INIT
// ══════════════════════════════════════
window.addEventListener('load', () => {
  apiKey = loadApiKey();
  if (apiKey) { hideKeyModal(); updateKeyIndicator(true); }
  else { document.getElementById('keyModal').classList.remove('hidden'); }
  document.getElementById('keyInput').addEventListener('keydown', e => { if (e.key === 'Enter') saveApiKey(); });

  addMontaMessage('考える前に、手を動かしてみようか。🐒\n\nモンタです。マンダラチャート、一緒に作ろう。\n\n進め方どっちにする？\n\n A）提案型（おすすめ）\n　 僕が先に叩き台を出す。選んで調整するだけ。\n\n B）対話型\n　 一つずつ、じっくり一緒に。');

  document.getElementById('userInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  document.getElementById('userInput').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 110) + 'px';
  });
});

// ══════════════════════════════════════
//  CHAT
// ══════════════════════════════════════
function addMontaMessage(text) { messages.push({ role: 'assistant', content: text }); renderMessage('monta', text); }
function addUserMessage(text) { messages.push({ role: 'user', content: text }); renderMessage('user', text); }

function scrollToBottom() {
  const c = document.getElementById('chatMessages');
  c.scrollTop = c.scrollHeight;
}

function renderMessage(who, text) {
  const container = document.getElementById('chatMessages');
  const typing = container.querySelector('.typing-msg');
  if (typing) typing.remove();

  const msgEl = document.createElement('div');
  msgEl.className = `msg ${who}`;

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = who === 'monta' ? '🐒' : 'you';

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text.replace(/```mandala[\s\S]*?```/g, '').trim();

  const time = document.createElement('div');
  time.className = 'msg-time';
  const now = new Date();
  time.textContent = `${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;

  const inner = document.createElement('div');
  inner.style.cssText = 'display:flex;flex-direction:column;max-width:min(500px,calc(100% - 44px));';
  inner.appendChild(bubble);
  inner.appendChild(time);

  if (who === 'user') { msgEl.appendChild(inner); msgEl.appendChild(avatar); }
  else { msgEl.appendChild(avatar); msgEl.appendChild(inner); }

  container.appendChild(msgEl);
  scrollToBottom();
}

function showTyping() {
  const container = document.getElementById('chatMessages');
  const wrapper = document.createElement('div');
  wrapper.className = 'msg monta typing-msg';
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = '🐒';
  const ind = document.createElement('div');
  ind.className = 'typing-indicator';
  ind.innerHTML = '<span></span><span></span><span></span>';
  wrapper.appendChild(avatar);
  wrapper.appendChild(ind);
  container.appendChild(wrapper);
  scrollToBottom();
}

// ══════════════════════════════════════
//  SEND
// ══════════════════════════════════════
async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;
  addUserMessage(text);
  input.value = ''; input.style.height = 'auto';
  if (!apiKey) { showKeyModal(); return; }
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;
  showTyping();

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 2500,
        system: MONTA_SYSTEM,
        messages: messages.slice(-24)
      })
    });
    const data = await res.json();
    const reply = data.content?.[0]?.text || 'ごめん、うまく受け取れなかった…もう一度話しかけて';
    addMontaMessage(reply);

    // mandalaブロック検出
    const mandalaMatch = reply.match(/```mandala\n([\s\S]*?)\n```/);
    if (mandalaMatch) {
      try {
        const mandalaData = JSON.parse(mandalaMatch[1]);
        currentMandalaData = mandalaData;
        insertScrollCard(mandalaData);
      } catch(e) {
        console.error('Mandala parse error:', e);
        addMontaMessage('チャートの描画でちょっとつまずいた。「もう一度チャートを出して」って言ってみて');
      }
    }
  } catch(e) {
    console.error(e);
    addMontaMessage('通信がちょっと途切れた。もう一度試してみて');
  } finally {
    isLoading = false;
    document.getElementById('sendBtn').disabled = false;
  }
}

// ══════════════════════════════════════
//  9x9グリッド配置ロジック
// ══════════════════════════════════════
function buildMandalaGrid(data) {
  const cells = new Array(81).fill(null).map(() => ({ type: 'empty', text: '' }));
  const center = data.center || '';
  const pillars = data.pillars || [];

  const blockPos = [
    [0,0],[0,3],[0,6],
    [3,6],[6,6],[6,3],
    [6,0],[3,0]
  ];
  const itemOffsets = [
    [0,0],[0,1],[0,2],
    [1,0],     [1,2],
    [2,0],[2,1],[2,2]
  ];
  const pillarPos = [
    [3,3],[3,4],[3,5],
    [4,3],     [4,5],
    [5,3],[5,4],[5,5]
  ];

  cells[4*9+4] = { type: 'goal', text: center };

  pillars.forEach((pillar, pi) => {
    const [br, bc] = blockPos[pi];
    cells[(br+1)*9+(bc+1)] = { type: 'subcenter', text: pillar.name || '' };
    cells[pillarPos[pi][0]*9+pillarPos[pi][1]] = { type: 'pillar', text: pillar.name || '' };
    const items = pillar.items || [];
    itemOffsets.forEach((offset, ii) => {
      const r = br + offset[0];
      const c = bc + offset[1];
      const t = items[ii] || '';
      cells[r*9+c] = { type: t ? 'item' : 'empty', text: t };
    });
  });
  return cells;
}

// ══════════════════════════════════════
//  巻物カードをチャットに挿入
// ══════════════════════════════════════
function insertScrollCard(data) {
  const container = document.getElementById('chatMessages');

  const wrapper = document.createElement('div');
  wrapper.className = 'msg monta';
  wrapper.style.maxWidth = '100%';

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = '🐒';

  const cardWrapper = document.createElement('div');
  cardWrapper.className = 'scroll-card-wrapper';

  const outer = document.createElement('div');
  outer.className = 'scroll-preview-outer';

  // ヘッダー
  outer.innerHTML = `
    <div class="scroll-preview-header">
      <span>🐒 ${data.title || 'マンダラチャート'}</span>
      <span class="preview-tag">PREVIEW</span>
    </div>`;

  // 巻物本体（PNG出力対象）
  const card = document.createElement('div');
  card.className = 'scroll-card';
  card.id = 'scrollCardBody_' + Date.now();

  const cells = buildMandalaGrid(data);
  let gridHtml = '<div class="mandala-scroll-grid">';
  cells.forEach(cell => {
    gridHtml += `<div class="sc ${cell.type}">${cell.text || (cell.type === 'empty' ? '·' : '')}</div>`;
  });
  gridHtml += '</div>';

  const insights = data.insights || ['—', '—', '—'];
  const insightsHtml = insights.map((ins, i) =>
    `<div class="scroll-insight-item"><span class="insight-num">${i+1}</span><span>${ins}</span></div>`
  ).join('');

  const today = new Date().toLocaleDateString('ja-JP', { year:'numeric', month:'2-digit', day:'2-digit' });

  card.innerHTML = `
    <div class="scroll-top">
      <div class="scroll-title">${data.title || 'MANDALA CHART'}</div>
      <div class="scroll-center-goal">${data.center || ''}</div>
      ${data.monta_question ? `<div class="scroll-monta-label">Montaの問い</div><div class="scroll-monta-word">${data.monta_question}</div>` : ''}
    </div>

    <div class="scroll-grid-section">
      <div class="scroll-grid-label">9 × 9 MANDALA</div>
      ${gridHtml}
    </div>

    <div class="scroll-bottom">
      <div class="scroll-insights">
        <div class="scroll-insights-title">🐒 MONTA'S INSIGHTS</div>
        ${insightsHtml}
      </div>
      ${data.first_move ? `
      <div class="scroll-itte">
        <div class="scroll-itte-label">今日の一手</div>
        <div class="scroll-itte-text">→ ${data.first_move}</div>
      </div>` : ''}
    </div>

    <div class="scroll-footer">
      <div class="scroll-footer-left">mandalamonchy / QQ #012 / ${today}</div>
      <div class="scroll-monkey">🐒</div>
    </div>`;

  // アクションボタン
  const actions = document.createElement('div');
  actions.className = 'scroll-actions';
  const cardId = card.id;
  actions.innerHTML = `
    <p>できたよ 🐒 PNGで保存できるよ</p>
    <button class="btn-action btn-png" onclick="saveAsPNG('${cardId}')">⬇ PNG保存</button>
    <button class="btn-action btn-secondary" onclick="saveAsHTML()">HTML保存</button>`;

  outer.appendChild(card);
  outer.appendChild(actions);
  cardWrapper.appendChild(outer);
  wrapper.appendChild(avatar);
  wrapper.appendChild(cardWrapper);
  container.appendChild(wrapper);
  scrollToBottom();
}

// ══════════════════════════════════════
//  PNG保存
// ══════════════════════════════════════
async function saveAsPNG(cardId) {
  const card = document.getElementById(cardId);
  if (!card) return;
  const overlay = document.getElementById('pngOverlay');
  overlay.classList.remove('hidden');
  try {
    const canvas = await html2canvas(card, {
      scale: 2,
      useCORS: true,
      backgroundColor: '#fdf8f0',
      logging: false
    });
    const link = document.createElement('a');
    link.download = `mandalamonchy-${new Date().toISOString().slice(0,10)}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch(e) {
    console.error('PNG error:', e);
    alert('PNG保存に失敗しました。HTMLで保存してみてね。');
  } finally {
    overlay.classList.add('hidden');
  }
}
